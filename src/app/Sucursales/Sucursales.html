<!-- Muestra la vista de la carpeta 'AdminSucur' solo si el rol es admin -->
<app-admin-sucur *hasRole="'admin'"></app-admin-sucur>

<!-- Muestra la vista de la carpeta 'TrabajadorSucur' si el rol es trabajador -->
<app-trabajador-sucur *hasRole="'trabajador'"></app-trabajador-sucur>

<!-- Muestra la vista de la carpeta 'ClienteSucur' si el rol es cliente -->
<app-cliente-sucur *hasRole="['cliente', 'visitante']"></app-cliente-sucur>
